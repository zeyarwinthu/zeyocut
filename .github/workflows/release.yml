name: Release

# Pushing a tag such as v0.1.0 builds, tests and publishes that version: the exe zip, the MCP Bundle
# (.mcpb) and their SHA-256 checksums, on a GitHub Release whose notes come from CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  MCPB_VERSION: "2.1.2"

jobs:
  release:
    name: Publish the release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Check the tag matches the version
        id: version
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME doesn't match <Version>$version</Version> in Directory.Build.props"
          }
          $manifest = Get-Content packaging/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "packaging/manifest.json has version $($manifest.version), not $version"
          }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) {
            throw "CHANGELOG.md has no '## [$version]' section"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # FFMPEG_PATH points at the real ffmpeg.exe, not Chocolatey's shim (see ci.yml).
      - name: Install FFmpeg
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg\tools -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found under C:\ProgramData\chocolatey\lib\ffmpeg\tools" }
          "FFMPEG_PATH=$($ffmpeg.DirectoryName)" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build ZeyoCut.slnx -c Release

      - name: Test
        run: '& ./tests/ZeyoCut.Tests/bin/Release/net10.0/ZeyoCut.Tests.exe'

      - name: Publish the single-file exe
        run: dotnet publish src/ZeyoCut.Mcp -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/publish

      # The notices of the native code inside the exe, from the NuGet packages it was built from.
      - name: Collect the license files
        run: |
          $assets = Get-Content src/ZeyoCut.Mcp/obj/project.assets.json -Raw | ConvertFrom-Json
          $nuget = @($assets.packageFolders.PSObject.Properties.Name)[0]
          function Package([string] $name) {
            $key = $assets.libraries.PSObject.Properties.Name | Where-Object { $_ -like "$name/*" } | Select-Object -First 1
            if (-not $key) { throw "$name isn't a dependency of ZeyoCut.Mcp" }
            Join-Path $nuget $key.ToLowerInvariant()
          }
          # The runtime pack the publish used; its version is stored as a range, [10.0.12, 10.0.12].
          $pack = @($assets.project.frameworks.PSObject.Properties.Value.downloadDependencies) | Where-Object { $_.name -eq "Microsoft.NETCore.App.Runtime.win-x64" } | Select-Object -First 1
          if (-not $pack) { throw "the publish didn't restore the win-x64 runtime pack" }
          $runtime = Join-Path $nuget "microsoft.netcore.app.runtime.win-x64/$($pack.version.Trim('[', ']').Split(',')[0].Trim())"
          $licenses = New-Item -ItemType Directory -Force out/licenses
          $files = [ordered]@{
            "dotnet-THIRD-PARTY-NOTICES.txt" = Join-Path $runtime "THIRD-PARTY-NOTICES.TXT"
            "SkiaSharp-THIRD-PARTY-NOTICES.txt" = Join-Path (Package "SkiaSharp.NativeAssets.Win32") "THIRD-PARTY-NOTICES.txt"
            "onnxruntime-ThirdPartyNotices.txt" = Join-Path (Package "Microsoft.ML.OnnxRuntime.DirectML") "ThirdPartyNotices.txt"
            "DirectML-LICENSE.txt" = Join-Path (Package "Microsoft.AI.DirectML") "LICENSE.txt"
            "DirectML-ThirdPartyNotices.txt" = Join-Path (Package "Microsoft.AI.DirectML") "ThirdPartyNotices.txt"
          }
          foreach ($entry in $files.GetEnumerator()) {
            Copy-Item -LiteralPath $entry.Value -Destination (Join-Path $licenses $entry.Key)
          }

      - name: Make the zip
        id: zip
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = New-Item -ItemType Directory -Force out/zip
          Copy-Item out/publish/ZeyoCut.Mcp.exe, out/publish/appsettings.json, README.md, LICENSE, THIRD_PARTY_NOTICES.md, CHANGELOG.md -Destination $stage
          Copy-Item out/licenses -Destination $stage -Recurse
          $zip = "out/ZeyoCut-$version-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          "file=$zip" >> $env:GITHUB_OUTPUT

      - name: Make the MCP Bundle
        id: mcpb
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stage = New-Item -ItemType Directory -Force out/mcpb
          $server = New-Item -ItemType Directory -Force out/mcpb/server
          Copy-Item packaging/manifest.json -Destination $stage
          Copy-Item out/publish/ZeyoCut.Mcp.exe, out/publish/appsettings.json -Destination $server
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination $stage
          Copy-Item out/licenses -Destination $stage -Recurse
          $bundle = "out/ZeyoCut-$version.mcpb"
          npx --yes "@anthropic-ai/mcpb@$env:MCPB_VERSION" validate out/mcpb/manifest.json
          if ($LASTEXITCODE -ne 0) { throw "the manifest isn't valid" }
          npx --yes "@anthropic-ai/mcpb@$env:MCPB_VERSION" pack out/mcpb $bundle
          if ($LASTEXITCODE -ne 0) { throw "mcpb pack failed" }
          "file=$bundle" >> $env:GITHUB_OUTPUT

      - name: Write checksums and release notes
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = "${{ steps.zip.outputs.file }}", "${{ steps.mcpb.outputs.file }}"
          $sums = foreach ($file in $files) { "$((Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant())  $(Split-Path -Leaf $file)" }
          Set-Content -Path out/SHA256SUMS.txt -Value $sums -Encoding utf8NoBOM

          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[Unreleased\]:|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no '## [$version]' section" }
          $source = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_REF_NAME"
          $notes = @(
            $section.Groups[1].Value.Trim()
            ""
            "**Source code of this release:** [$env:GITHUB_REF_NAME]($source)"
            ""
            "**SHA-256** (check a download with ``Get-FileHash <file>`` in PowerShell):"
            ""
            '```text'
            $sums
            '```'
          )
          Set-Content -Path out/notes.md -Value $notes -Encoding utf8NoBOM

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "${{ steps.zip.outputs.file }}" "${{ steps.mcpb.outputs.file }}" out/SHA256SUMS.txt --verify-tag --title "ZeyoCut ${{ steps.version.outputs.version }}" --notes-file out/notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
